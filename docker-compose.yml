services:
  frontend:
    build:
      context: .
      args:
        VITE_VENTAS_URL: ${VITE_VENTAS_URL:-http://localhost:8080}
        VITE_DESPACHOS_URL: ${VITE_DESPACHOS_URL:-http://localhost:8081}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - nginx_logs:/var/log/nginx

volumes:
  nginx_logs:
    driver: local
