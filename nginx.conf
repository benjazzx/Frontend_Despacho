server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy hacia microservicio de ventas (backend privado)
    location /api/v1/ventas {
        proxy_pass http://10.0.9.120:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy hacia microservicio de despachos (backend privado)
    location /api/v1/despachos {
        proxy_pass http://10.0.9.120:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Servir React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
